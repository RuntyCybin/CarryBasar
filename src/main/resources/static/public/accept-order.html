<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
        }

        footer {
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <header class="bg-dark text-white text-center p-3">
        <nav>
            <div class="container-fluid">
                <a href="dashboard.html" class="text-white m-2">Dashboard</a>
                <a href="about.html" class="text-white m-2">Sobre mí</a>
                <a href="contact.html" class="text-white m-2">Contacto</a>
                <a href="profile.html" class="text-white m-2">Perfil</a>

                <span class="navbar-text" id="roleUser">
                    Navbar text with an inline element
                </span>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="container">
            <div class="row">
                <div class="col" style="padding-left: 0;">
                    <h1>Ordenes aceptadas</h1>
                </div>
            </div>

            <div class="row">
                <div class="col" style="padding-left: 0;">
                    <p id="descAcceptOrder">Listado de ordenes aceptadas por <span id="username"></span>.</p>
                </div>
                <div class="col" style="text-align: right; padding-right: 0;">
                    <div class="btn-group btn-group-lg" role="group" aria-label="Large button group"
                        id="salirCrearBtns">
                        <button type="button" id="logoutBtn" class="btn btn-outline-primary">Salir</button>
                        <button type="button" class="btn btn-outline-success">Finalizada</button>
                        <button type="button" class="btn btn-outline-warning">Rechazar</button>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="list-group mt-4" id="acceptedOrderList">
                        <a href="#" class="list-group-item list-group-item-action d-flex gap-3 py-3"
                            aria-current="true">
                            <img src="https://github.com/twbs.png" alt="" width="32" height="32"
                                class="rounded-circle flex-shrink-0">
                            <div class="d-flex gap-2 w-100 justify-content-between">
                                <div>
                                    <h6 class="mb-0">List group item heading</h6>
                                    <p class="mb-0 opacity-75" id="desc">Some placeholder content in a paragraph.</p>
                                    <p class="mb-0 opacity-75" id="volume">Some placeholder content in a paragraph.</p>
                                </div>
                                <small class="opacity-50 text-nowrap" id="date">now</small>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center p-3">
        <p>Derechos reservados por Carry Basar &copy; 2025</p>
    </footer>

    <script src="/public/js/accept-order.js"></script>
</body>

</html>
