<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <div id="alertContainer" class="container mt-3"></div>
    <div class="login-container">
        <div style="text-align: center; margin-top: 2rem;">
            <img src="/public/img/logo_transparente.png" alt="Logística" width="64" height="64">
        </div>
        <h2>Recuperar contraseña</h2>
        <form id="recoverPwdForm">
            <div class="form-group">
                <label for="useremail">Email usuario</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña nueva</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="password">Repita contraseña nueva</label>
                <input type="password" id="passwordRepeat" name="passwordRepeat" required>
            </div>
            <button type="submit" class="login-btn">Cambiar</button>
            <div id="error" class="error-message"></div>
        </form>
    </div>

    <script src="/public/js/forgot-pwd.js"></script>
</body>

</html>
