<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100">

<div id="alertContainer" class="max-w-sm mx-auto w-full mt-4 px-4"></div>

<main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
        <div class="flex justify-center mb-4">
            <img src="/public/img/logo_transparente.png" alt="Logística" width="64" height="64">
        </div>
        <h2 class="text-2xl font-semibold text-center mb-6">Recuperar contraseña</h2>
        <form id="recoverPwdForm" class="space-y-4">
            <div>
                <label for="useremail" class="block mb-1 text-sm font-medium text-gray-700">Email usuario</label>
                <input type="email" id="useremail" name="useremail" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="password" class="block mb-1 text-sm font-medium text-gray-700">Contraseña nueva</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="passwordRepeat" class="block mb-1 text-sm font-medium text-gray-700">Repita contraseña nueva</label>
                <input type="password" id="passwordRepeat" name="passwordRepeat" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition-colors">
                Cambiar
            </button>
            <div id="error" class="text-red-600 text-center text-sm"></div>
        </form>
    </div>
</main>

<script src="/public/js/forgot-pwd.js"></script>
</body>

</html>
