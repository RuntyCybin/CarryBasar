<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
      html,
      body {
          height: 100%;
          margin: 0;
      }

      body {
          display: flex;
          flex-direction: column;
      }

      main {
          flex: 1 0 auto;
      }

      footer {
          flex-shrink: 0;
      }
  </style>
</head>

<body class="bg-gray-50">

<header class="bg-gray-900 text-white p-3">
  <nav class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
    <div class="flex flex-wrap items-center gap-4">
      <a href="dashboard.html" class="hover:text-gray-300">Dashboard</a>
      <a href="about.html" class="hover:text-gray-300">Sobre mí</a>
      <a href="contact.html" class="hover:text-gray-300">Contacto</a>
      <a href="profile.html" class="hover:text-gray-300">Perfil</a>
    </div>
    <span class="text-gray-300 text-sm" id="roleUser"></span>
  </nav>
</header>

<div id="alertContainer" class="max-w-2xl mx-auto w-full mt-3 px-4"></div>

<main class="max-w-2xl mx-auto w-full my-8 px-4">
  <form id="profileForm" class="bg-white rounded-lg shadow p-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold">Perfil</h1>
        <p id="descDashboard" class="text-gray-600 text-sm mt-1">Formulario para modificar datos del usuario
          <span id="username" class="font-semibold"></span>.</p>
      </div>
      <div class="flex gap-2" id="salirCrearBtns">
        <button type="button" id="logoutBtn"
                class="border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
          Salir
        </button>
        <button type="submit"
                class="border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
          Actualizar
        </button>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label for="userNameMod" class="block mb-1 text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" id="userNameMod" name="nombre"
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="userEmail" class="block mb-1 text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="userEmail" name="email" aria-describedby="emailHelp"
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="emailHelp" class="text-gray-500 text-xs mt-1">Su email no sera compartido con nadie.</p>
      </div>
      <div>
        <label for="userPassword" class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="userPassword" name="password"
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="rolesList" class="block mb-1 text-sm font-medium text-gray-700">Roles</label>
        <select id="rolesList" name="roles" multiple required
                class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
      </div>
    </div>
  </form>
</main>

<footer class="bg-gray-900 text-white text-center p-3">
  <p>Derechos reservados por Carry Basar &copy; 2025</p>
</footer>
<script src="/public/js/profile.js"></script>
</body>

</html>
