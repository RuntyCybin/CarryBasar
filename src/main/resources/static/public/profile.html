<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      html,
      body {
          height: 100%;
          margin: 0;
      }

      body {
          display: flex;
          flex-direction: column;
      }

      main {
          flex: 1 0 auto;
      }

      footer {
          flex-shrink: 0;
      }
  </style>
</head>

<body>

<header class="bg-dark text-white text-center p-3">
  <nav>
    <a href="dashboard.html" class="text-white m-2">Dashboard</a>
    <a href="about.html" class="text-white m-2">Sobre mí</a>
    <a href="contact.html" class="text-white m-2">Contacto</a>
    <a href="profile.html" class="text-white m-2">Perfil</a>

    <span class="navbar-text" id="roleUser">
                Navbar text with an inline element
            </span>
  </nav>
</header>

<div id="alertContainer" class="container mt-3"></div>

<main class="container my-5">
  <form id="profileForm">
    <div class="container">
      <div class="row">
        <div class="col">
          <h1>Profile</h1>
        </div>
      </div>

      <!-- TITULO & BOTONES -->
      <div class="row">
        <div class="col">
          <p id="descDashboard">Formulario para modificar datos del usuario <span id="username"></span>.
          </p>
        </div>
        <div class="col" style="text-align: right;">
          <div class="btn-group btn-group-lg" role="group" aria-label="Large button group"
               id="salirCrearBtns">
            <button type="button" id="logoutBtn" class="btn btn-outline-primary">Salir</button>
            <button type="submit" class="btn btn-outline-primary">Actualizar</button>
          </div>
        </div>
      </div>

      <!-- NOMBRE EMAIL PWD -->
      <div class="row">
        <div class="col">
          <div class="mb-3">
            <label for="userNameMod" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="userNameMod" aria-describedby="emailHelp" name="nombre">
          </div>
          <div class="mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="userEmail" aria-describedby="emailHelp" name="email">
            <div id="emailHelp" class="form-text">Su email no sera compartido con nadie.</div>
          </div>
          <div class="mb-3">
            <label for="userPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="userPassword" name="password">
          </div>
        </div>
      </div>

      <!-- LISTADO ROLES -->
      <div class="row">
        <div class="col">
          <div class="mb-3">
            <label for="rolesList" class="form-label">Roles</label>
            <select class="form-select" id="rolesList" name="roles" multiple required></select>
          </div>
        </div>
      </div>
    </div>
  </form>
</main>

<footer class="bg-dark text-white text-center p-3">
  <p>Derechos reservados por Carry Basar &copy; 2025</p>
</footer>
<script src="/public/js/profile.js"></script>
</body>

</html>
