<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
      html,
      body {
          height: 100%;
          margin: 0;
      }

      body {
          display: flex;
          flex-direction: column;
      }

      main {
          flex: 1 0 auto;
      }

      footer {
          flex-shrink: 0;
      }
  </style>
</head>

<body class="bg-gray-50">

<header class="bg-gray-900 text-white p-3">
  <nav class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
    <div class="flex flex-wrap items-center gap-4">
      <a href="dashboard.html" class="hover:text-gray-300">Dashboard</a>
      <a href="about.html" class="hover:text-gray-300">Sobre mí</a>
      <a href="contact.html" class="hover:text-gray-300">Contacto</a>
      <a href="profile.html" class="hover:text-gray-300">Perfil</a>
    </div>
    <span class="text-gray-300 text-sm" id="roleUser"></span>
  </nav>
</header>

<div id="alertContainer" class="max-w-5xl mx-auto w-full mt-3 px-3"></div>

<main class="max-w-5xl mx-auto w-full my-8 px-3">
  <h1 class="text-3xl font-bold mb-4">Dashboard</h1>

  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <p id="descDashboard" class="text-gray-700">Listado de contratos para <span id="username" class="font-semibold"></span>.</p>
    <div class="flex gap-2" id="salirCrearBtns">
      <button type="button" id="logoutBtn"
              class="border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
        Salir
      </button>
      <a href="create-order.html"
         class="border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
        Crear pedido
      </a>
    </div>
  </div>

  <div class="flex flex-col gap-3" id="ordersList">
    <a href="#"
       class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
      <img src="https://github.com/twbs.png" alt="" width="32" height="32" class="rounded-full flex-shrink-0">
      <div class="flex gap-2 w-full justify-between">
        <div>
          <h6 class="font-semibold text-sm">List group item heading</h6>
          <p class="text-gray-500 text-sm" id="desc">Some placeholder content in a paragraph.</p>
          <p class="text-gray-500 text-sm" id="volume">Some placeholder content in a paragraph.</p>
        </div>
        <small class="text-gray-400 text-xs whitespace-nowrap" id="date">now</small>
        <small class="text-gray-400 text-xs whitespace-nowrap" id="dueDate">due date</small>
      </div>
    </a>
  </div>
</main>

<footer class="bg-gray-900 text-white text-center p-3">
  <p>Derechos reservados por Carry Basar &copy; 2025</p>
</footer>

<script src="/public/js/dashboard.js"></script>
</body>

</html>
