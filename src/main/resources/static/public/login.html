<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100">

<main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
        <div class="flex justify-center mb-4">
            <img src="/public/img/logo_transparente.png" alt="Logística" width="64" height="64">
        </div>
        <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block mb-1 text-sm font-medium text-gray-700">Usuario</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="password" class="block mb-1 text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition-colors">
                Login
            </button>
            <div id="error" class="text-red-600 text-center text-sm"></div>
            <a href="forgot-pwd.html"
               class="block text-center border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
                Olvide mi contraseña
            </a>
        </form>
        <p class="text-center mt-6 text-sm text-gray-600">¿No tienes cuenta?
            <a href="register.html" class="text-blue-600 hover:underline">Regístrate aquí</a>
        </p>
    </div>
</main>

<footer class="bg-gray-900 text-white text-center p-3">
    <p>&copy; 2023 CarryBasar. Todos los derechos reservados.</p>
</footer>

<script src="/public/js/login.js"></script>
</body>

</html>
