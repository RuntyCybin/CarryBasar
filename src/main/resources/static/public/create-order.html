<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear pedido</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
        }

        footer {
            flex-shrink: 0;
        }
    </style>
</head>

<body class="bg-gray-50">

<header class="bg-gray-900 text-white p-3">
    <nav class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-4">
            <a href="dashboard.html" class="hover:text-gray-300">Dashboard</a>
            <a href="about.html" class="hover:text-gray-300">Sobre mí</a>
            <a href="contact.html" class="hover:text-gray-300">Contacto</a>
            <a href="profile.html" class="hover:text-gray-300">Perfil</a>
        </div>
        <span class="text-gray-300 text-sm" id="roleUser"></span>
    </nav>
</header>

<div id="alertContainer" class="max-w-2xl mx-auto w-full mt-3 px-4"></div>

<main class="max-w-2xl mx-auto w-full my-8 px-4">
    <form id="createOrderForm" class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold mb-6">Crear nuevo pedido</h1>

        <div class="space-y-4">
            <div>
                <label for="description" class="block mb-1 text-sm font-medium text-gray-700">Descripción del pedido</label>
                <input type="text" id="description" name="description" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="volume" class="block mb-1 text-sm font-medium text-gray-700">Volumen (metros cubicos)</label>
                <input type="number" id="volume" name="volume" min="1" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="price" class="block mb-1 text-sm font-medium text-gray-700">Precio (€)</label>
                <input type="number" id="price" name="price" min="0" step="0.01" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="dueDate" class="block mb-1 text-sm font-medium text-gray-700">Fecha límite</label>
                <input type="date" id="dueDate" name="dueDate" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="fromLocation" class="block mb-1 text-sm font-medium text-gray-700">Direccion - Desde</label>
                <input type="text" id="fromLocation" name="fromLocation" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="toLocation" class="block mb-1 text-sm font-medium text-gray-700">Direccion - Donde</label>
                <input type="text" id="toLocation" name="toLocation" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <button type="submit"
                class="mt-6 border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded transition-colors font-medium">
            Crear pedido
        </button>
    </form>
</main>

<footer class="bg-gray-900 text-white text-center p-3">
    <p>Derechos reservados por Carry Basar &copy; 2025</p>
</footer>

<script src="/public/js/create-order.js"></script>
</body>

</html>
