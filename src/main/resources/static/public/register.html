<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/public/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>

<body>

    <main class="container my-5">
        <form id="signUpForm">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <h1>Alta de usuario</h1>
                    </div>
                </div>

                <!-- TITULO & BOTONES -->
                <div class="row">
                    <div class="col">
                        <p id="descDashboard">Formulario a rellenar para darse de alta.</p>
                    </div>
                    <div class="col" style="text-align: right;">
                        <div class="btn-group btn-group-lg" role="group" aria-label="Large button group"
                            id="salirCrearBtns">
                            <button type="submit" class="btn btn-outline-primary">Registrar</button>
                            <button type="button" id="logoutBtn" class="btn btn-outline-primary">Salir</button>
                        </div>
                    </div>
                </div>

                <!-- NOMBRE EMAIL PWD -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label for="userName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="userName" aria-describedby="emailHelp"
                                name="nombre">
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="userEmail" aria-describedby="emailHelp"
                                name="email">
                            <div id="emailHelp" class="form-text">Su email no sera compartido con nadie.</div>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="userPassword" name="password">
                        </div>
                        <div class="mb-3">
                            <label for="userPassword2" class="form-label">Repite Password</label>
                            <input type="password" class="form-control" id="userPassword2" name="password2">
                            <div id="emailHelp" class="form-text">Repite el password para verificarlo.</div>
                        </div>
                    </div>
                </div>

                <!-- LISTADO ROLES -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label for="roles" class="form-label">Roles</label>
                            <select class="form-select" id="rolesList" name="roles" multiple required></select>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <footer class="bg-dark text-white text-center p-3" style="position: fixed; bottom: 0; left: 0; width: 100%;">
        <p>Derechos reservados por Carry Basar &copy; 2025</p>
    </footer>
    <script src="/public/js/register.js"></script>
</body>
</html>
